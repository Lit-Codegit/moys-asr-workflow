[project]
name = "moys-asr-workflow"
version = "1.3.1"
description = "A small cloud ASR API to local subtitle-editor workflow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "jieba>=0.42",
    "pywebview>=6.2.1",
    "requests>=2.28",
    # 本地默认 ASR 引擎（faster-whisper 内置 ctranslate2，GPU 加速）
    "faster-whisper>=1.2",
]

[dependency-groups]
build = [
    "pyinstaller==6.16.0",
]
